<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DilKholDesire — Live Booking & UTR Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0b0712; color: #fff; font-family: 'Poppins', sans-serif; padding: 15px; }
        h1 { color: #ff007f; text-align: center; margin-bottom: 5px; font-size: 1.5rem; }
        p.sub { text-align: center; color: #a0a0a0; font-size: 0.85rem; margin-bottom: 20px; }
        .refresh-btn { display: block; margin: 0 auto 20px auto; background: linear-gradient(45deg, #ff007f, #9d4edd); color: #fff; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255,0,127,0.3); }
        .table-container { overflow-x: auto; background: #150d22; border-radius: 10px; border: 1px solid #ff007f; padding: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; min-width: 700px; }
        th { background: #ff007f; color: #fff; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #2a1b40; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
        .ip-badge { background: #ffd700; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .utr-badge { color: #25d366; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🔐 DilKholDesire Admin Panel</h1>
    <p class="sub">लाइव बुकिंग रिकॉर्ड्स, IP एड्रेस व पेमेंट यूटीआर ट्रैकर</p>
    
    <button class="refresh-btn" onclick="fetchData()">🔄 डेटा रीफ्रेश करें (Refresh Data)</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Real Name</th>
                    <th>Nickname</th>
                    <th>Mobile No</th>
                    <th>Age</th>
                    <th>Topic</th>
                    <th>Time Slot</th>
                    <th>UTR Number</th>
                    <th>IP Address</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9" style="text-align: center;">⏳ डेटा लोड हो रहा है...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        var sheetDbURL = "https://sheetdb.io/api/v1/qiguupoleogiz";

        async function fetchData() {
            var tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">⏳ डेटा कनेक्ट हो रहा है...</td></tr>';

            try {
                let response = await fetch(sheetDbURL);
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                let data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #ffd700;">📂 अभी कोई नई बुकिंग दर्ज नहीं हुई है। (Sheet Empty)</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.slice().reverse().forEach(row => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row["Timestamp"] || row["timestamp"] || "-"}</td>
                        <td><b>${row["Real Name"] || row["realname"] || "-"}</b></td>
                        <td>${row["Nickname"] || row["nickname"] || "-"}</td>
                        <td>${row["Mobile No"] || row["mobileno"] || "-"}</td>
                        <td>${row["Age"] || row["age"] || "-"}</td>
                        <td>${row["Topic"] || row["topic"] || "-"}</td>
                        <td>${row["Time Slot"] || row["timeslot"] || "-"}</td>
                        <td class="utr-badge">${row["UTR Number"] || row["utrnumber"] || "-"}</td>
                        <td><span class="ip-badge">${row["IP Address"] || row["ipaddress"] || "-"}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Fetch Error:", err);
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #ff007f;">⚠️ कनेक्शन रिफ्रेश करें या मुख्य फ़ॉर्म से एक टेस्ट एंट्री सबमिट करें।</td></tr>';
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
